# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install binance-connector==3.5.0
        python3 setup.py develop
        pip install ruff==0.17.2 coveralls PyYAML
    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .
    - name: Test with pytest
      run: |
        pytest tests/* --cov smrti_quant_alerts --cov-config=.coveragerc --cov-report term-missing --disable-warnings --cov-fail-under=90
    - name: Report Coverage
      run: |
        if [ ${{ matrix.python-version }} == "3.8" ]; then coveralls --rcfile=.coveragerc; fi
    
