name: Distribution smoke tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - name: Verify installed CLI and packaged assets outside checkout
        working-directory: /tmp
        run: |
          smrti-alerts --help
          smrti-gui --help
          smrti-diagnose --help
          python - <<'PY'
          from importlib.resources import files
          assert files('smrti_quant_alerts.pdf_api').joinpath('DejaVuSansCondensed.ttf').is_file()
          assert files('smrti_quant_alerts.gui').joinpath('index.html').is_file()
          PY
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose without starting alerts
        run: ALERT_NAME=example docker compose config --quiet
      - name: Build production image
        run: docker build -t smrti-alerts:smoke .
      - name: Verify non-root image and credential-free CLI discovery
        run: |
          test "$(docker run --rm --entrypoint id smrti-alerts:smoke -u)" -ne 0
          docker run --rm --read-only --tmpfs /tmp smrti-alerts:smoke --help
          docker run --rm --read-only --tmpfs /tmp --entrypoint smrti-gui smrti-alerts:smoke --help
